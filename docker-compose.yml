services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: study-pgsql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: study123
      POSTGRES_DB: study_fastapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_fastapi"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: study-app
    ports:
      - "8000:8000"
    env_file:
      - .env                      # ① 整体注入本地 .env(ARK key 等共性配置)
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:study123@db:5432/study_fastapi
      REDIS_URL: redis://:redis123@redis:6379/0
      MCP_KB_SERVER_CMD: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8.10
    container_name: study-redis
    command: redis-server --requirepass redis123 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis123 ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  mysqldata:
  redisdata:
