services:
  db:
    image: postgres:18
    container_name: study-pgsql
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study123
      POSTGRES_DB: study_fastapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_fastapi"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: study-app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://study:study123@db:5432/study_fastapi
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
