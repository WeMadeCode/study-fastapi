[project]
name = "study-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pydantic[email,emial]>=2.13.5",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
study-fastapi = "study_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
