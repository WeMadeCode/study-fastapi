[project]
name = "study-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "openai>=3.17.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["app.services.llm.*", "scripts.*"]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]
