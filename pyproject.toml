[project]
name = "study-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "openai>=3.17.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN2"]   # 你的原则:返回类型能推导,不强制写(ANN2xx 全是返回标注规则)

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["app.services.llm.*", "scripts.*"]
# 遵守"能推导则不写":参数必须标(ruff ANN001 兜底),返回可省,推断类型照常检查
check_untyped_defs = true      # 完全没标注的函数,函数体也检查
disallow_any_generics = true   # 裸 list 禁止,必须 list[str]
no_implicit_optional = true    # str = None 必须写成 str | None
warn_return_any = true         # 返回值里混进 Any 要警告
warn_unused_ignores = true     # 多余的 type: ignore 要报

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]
